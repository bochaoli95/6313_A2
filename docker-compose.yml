version: "3.9"

services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    env_file:
      - .env
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    env_file:
      - .env
    networks:
      - app_network

  user_service_v1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_service_v1
    command: python -m user_service_v1.main
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8001:8001"
    networks:
      - app_network

  user_service_v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_service_v2
    command: python -m user_service_v2.main
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8002:8002"
    networks:
      - app_network

  order_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_service
    command: python -m order_service.main
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
    env_file:
      - .env
    depends_on:
      - mongodb
      - rabbitmq
      - user_service_v1
      - user_service_v2
    ports:
      - "8003:8003"
    networks:
      - app_network

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_gateway
    command: python -m api_gateway.main
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
    depends_on:
      - user_service_v1
      - user_service_v2
      - order_service
    ports:
      - "8000:8000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:

